# DigitalOcean App Platform configuration
name: psn-college-erp
services:
- name: api
  source_dir: /
  github:
    repo: samx007-bot/psn-college-erp
    branch: main
  run_command: npm start
  environment_slug: node-js
  instance_count: 1
  instance_size_slug: basic-xxs
  routes:
  - path: /
  envs:
  - key: NODE_ENV
    value: production
    type: GENERAL
  - key: PORT
    value: "8080"
    type: GENERAL